name: Build APWorld

on:
  push:
    branches: [ main, master, 'fix-*', 'fix/*', 'feature-*', 'feature/*' ]
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

jobs:
  # ── Build standalone Windows patcher exe ─────────────────────────
  build-patcher-exe:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PyQt6 pyyaml platformdirs colorama typing_extensions lz4 nlzss11 pathspec schema bsdiff4

    - name: Build standalone patcher exe
      run: python build_patcher_exe.py

    - name: Verify exe exists
      run: |
        if (!(Test-Path "dist\ArchipelagoSSHDPatcher.exe")) {
          Write-Error "ArchipelagoSSHDPatcher.exe not found after build"
          exit 1
        }
        $size = (Get-Item "dist\ArchipelagoSSHDPatcher.exe").Length / 1MB
        Write-Output "✅ ArchipelagoSSHDPatcher.exe built ($([math]::Round($size,1)) MB)"

    - name: Upload patcher artifact
      uses: actions/upload-artifact@v4
      with:
        name: sshd-patcher
        path: dist/ArchipelagoSSHDPatcher.exe
        retention-days: 90

  # ── Build the Rust client (sshd-ap-client) natively on every platform ──
  # build_ap_client.py does a native build and stages the binary in
  # sshd-ap-client/dist/<platform_tag>/, which matches the tags used by
  # build_apworld.py and __init__.py.
  build-rust-client:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tag: win_amd64
          - os: ubuntu-latest
            tag: manylinux2014_x86_64
          - os: macos-14          # Apple Silicon
            tag: macosx_11_0_arm64
          - os: macos-15-intel    # Intel
            tag: macosx_10_9_x86_64
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          sshd-ap-client/target
        key: rust-client-${{ matrix.tag }}-${{ hashFiles('sshd-ap-client/Cargo.lock') }}
        restore-keys: rust-client-${{ matrix.tag }}-

    - name: Install Linux GUI build dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev

    - name: Build Rust client
      run: python build_ap_client.py

    - name: Verify binary was staged
      shell: python
      run: |
        import sys
        from pathlib import Path
        d = Path("sshd-ap-client/dist/${{ matrix.tag }}")
        files = list(d.glob("ap-client*")) if d.exists() else []
        if not files:
            print("ap-client binary missing for ${{ matrix.tag }}")
            sys.exit(1)
        print("Built:", [f.name for f in files])

    - name: Upload Rust client artifact
      uses: actions/upload-artifact@v4
      with:
        name: ap-client-${{ matrix.tag }}
        path: sshd-ap-client/dist/
        retention-days: 90

  # ── Build the .apworld ────────────────────────────────────────────
  build-apworld:
    runs-on: ubuntu-latest
    needs: [build-patcher-exe, build-rust-client]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcairo2-dev pkg-config python3-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Download patcher exe (distributed separately)
      uses: actions/download-artifact@v4
      with:
        name: sshd-patcher
        path: .

    - name: Download Rust client binaries (all platforms)
      uses: actions/download-artifact@v4
      with:
        pattern: ap-client-*
        path: sshd-ap-client/dist
        merge-multiple: true

    - name: Verify Rust client binaries for all platforms
      run: |
        find sshd-ap-client/dist -type f | sort
        for tag in win_amd64 manylinux2014_x86_64 macosx_11_0_arm64 macosx_10_9_x86_64; do
          if ! ls sshd-ap-client/dist/$tag/ap-client* >/dev/null 2>&1; then
            echo "::error::Missing Rust client binary for $tag"
            exit 1
          fi
        done

    - name: Build APWorld
      env:
        # Binaries were prebuilt per-platform above; don't rebuild Linux here.
        SSHD_SKIP_RUST_BUILD: "1"
      run: |
        python build_apworld.py

    - name: Verify APWorld structure
      run: |
        echo "Verifying sshd.apworld structure..."
        python -m zipfile -l sshd.apworld | head -30

        # Check if key files exist in the archive
        python -c "
        import zipfile
        import sys

        required_files = [
            'sshd/_bundled_bin/win_amd64/ap-client.exe',
            'sshd/_bundled_bin/manylinux2014_x86_64/ap-client',
            'sshd/_bundled_bin/macosx_11_0_arm64/ap-client',
            'sshd/_bundled_bin/macosx_10_9_x86_64/ap-client',
            'sshd/__init__.py',
            'sshd/Items.py',
            'sshd/Locations.py',
            'sshd/Regions.py',
            'sshd/Rules.py',
            'sshd/archipelago.json'
        ]

        with zipfile.ZipFile('sshd.apworld', 'r') as zf:
            archive_files = zf.namelist()
            missing = [f for f in required_files if f not in archive_files]

            if missing:
                print('❌ Missing required files:')
                for f in missing:
                    print(f'  - {f}')
                sys.exit(1)
            else:
                print('✅ All required files present in APWorld')
        "

    - name: Upload APWorld artifact
      uses: actions/upload-artifact@v4
      with:
        name: sshd-apworld
        path: sshd.apworld
        retention-days: 90

  # ── Fuzz test the logic on your private server ───────────────────
  fuzz-test:
    runs-on: ubuntu-latest
    needs: build-apworld  # Only fuzz if the build actually finishes
    steps:
      - name: Trigger Remote Fuzzer
        run: |
          curl -sSN -f -X POST https://fuzzer.lonlonlabs.dev/api/fuzz \
          -H "Content-Type: application/json" \
          -H "X-API-KEY: ${{ secrets.FUZZER_KEY }}" \
          -d '{
            "repo_url": "https://github.com/${{ github.repository }}",
            "branch": "${{ github.ref_name }}",
            "apworld_name": "sshd",
            "runs": 500
          }'

  # ── Create release package ───────────────────────────────────────
  release:
    runs-on: ubuntu-latest
    needs: [build-patcher-exe, build-apworld]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/fix-') || startsWith(github.ref, 'refs/heads/fix/') || startsWith(github.ref, 'refs/heads/feature-') || startsWith(github.ref, 'refs/heads/feature/')

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare release files
      run: |
        mkdir -p release
        cp artifacts/sshd-apworld/sshd.apworld release/
        cp artifacts/sshd-patcher/ArchipelagoSSHDPatcher.exe release/
        cp SkywardSwordHD.yaml "release/SkywardSwordHD.yaml"

        echo "Release contents:"
        ls -lh release/

    - name: Update Continuous Release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/fix-') || startsWith(github.ref, 'refs/heads/fix/') || startsWith(github.ref, 'refs/heads/feature-') || startsWith(github.ref, 'refs/heads/feature/')
      uses: softprops/action-gh-release@v1
      with:
        tag_name: Continuous
        name: Continuous Build
        files: |
          release/sshd.apworld
          release/ArchipelagoSSHDPatcher.exe
          release/SkywardSwordHD.yaml
        body: |
          **Automated build from latest commit**

          This is an automatically generated build from the latest code.
          For stable releases, see the [Releases](https://github.com/${{ github.repository }}/releases) page.

          ### Quick Install
          1. Place `sshd.apworld` in your Archipelago `custom_worlds` folder
          2. Run `ArchipelagoSSHDPatcher.exe` to apply patches from a lightweight `.apsshd` file
          3. Open the Archipelago Launcher — click **Skyward Sword HD Client** to connect

          **Commit**: ${{ github.sha }}
          **Branch**: ${{ github.ref_name }}
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Tagged Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          release/sshd.apworld
          release/ArchipelagoSSHDPatcher.exe
          release/SkywardSwordHD.yaml
        body: |
          ## SSHD Archipelago ${{ github.ref_name }}

          ### Quick Install
          1. Place `sshd.apworld` in your Archipelago `custom_worlds` folder
          2. Run `ArchipelagoSSHDPatcher.exe` to apply patches from a lightweight `.apsshd` file
          3. Open the Archipelago Launcher — click **Skyward Sword HD Client** to connect

          See [README](https://github.com/${{ github.repository }}#quick-start) for full setup instructions.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
