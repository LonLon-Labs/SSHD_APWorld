[package]
name = "ap-client"
version = "0.1.0"
edition = "2021"

[dependencies]
ap-ipc = { path = "../ap-ipc" }
archipelago_rs = "3.0.1"
oneshot = "0.2"
iced = "0.13"
process-memory = { path = "../process-memory" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Console"] }

